name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull, build and restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Load NVM so Node/NPM/PM2 commands are recognized
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Go to your correct folder path
            cd /var/www/node-app
            
            # 3. Pull down fresh code from GitHub
            git fetch --all
            git reset --hard origin/main
            
            # 4. Install production modules
            npm install --production
            
            # 5. Restart or start your server file dynamically
            pm2 reload express-api --update-env || pm2 start server.js --name "express-api"
