name: Build and Deploy Node.js App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: devopsbootcampa/devops-node-app:latest
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Docker container to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Pull the latest Docker image from Docker Hub
            sudo docker pull devopsbootcampa/devops-node-app:latest

            # Stop and remove the old container if it exists
            sudo docker stop devops-node-app || true
            sudo docker rm devops-node-app || true

            # Run the new container, mapping port 3001 locally to port 3000 in the container
            sudo docker run -d \
              --name devops-node-app \
              --restart unless-stopped \
              -p 127.0.0.1:3001:3000 \
              devopsbootcampa/devops-node-app:latest

            # Verify the container is up and running
            sudo docker ps