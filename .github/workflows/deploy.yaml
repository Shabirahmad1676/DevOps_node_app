name: Deploy Node.js App with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Docker container to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Pull the latest Docker image
            sudo docker pull devopsbootcampa/devops-node-app:v1

            # Stop and remove the previous container if it exists
            sudo docker stop devops-node-app || true
            sudo docker rm devops-node-app || true

            # Start the new container (bound to localhost:3001 on the VM)
            sudo docker run -d \
              --name devops-node-app \
              --restart unless-stopped \
              -p 127.0.0.1:3001:3000 \
              devopsbootcampa/devops-node-app:v1

            # Verify container is running
            sudo docker ps