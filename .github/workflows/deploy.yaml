name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull, build and restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Load NVM so Node/NPM/PM2 environments are mounted
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Go to your correct, case-sensitive folder path
            cd /var/www/DevOps_node_app
            
            # 3. Pull down clean changes from GitHub
            git fetch --all
            git reset --hard origin/main
            
            # 4. Install dependencies
            npm install --production
            
            # 5. Automatically restart or launch server.js under PM2 process tracking
            pm2 reload express-api --update-env || pm2 start server.js --name "express-api"
